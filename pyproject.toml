[project]
name = "casebroker"
version = "0.1.0"
description = "Central case broker for the v2 real-city CFD campaign: one database of cases, many workers leasing the next one to simulate."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
casebroker = "casebroker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["casebroker"]
