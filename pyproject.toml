[project]
name = "casebroker"
# THE version. Semantic versioning (https://semver.org): MAJOR for a breaking
# change to the worker-facing protocol in README's "The protocol" table, MINOR
# for a backwards-compatible addition, PATCH for a fix that changes no shape.
# Nothing else in the tree hardcodes this -- casebroker/__init__.py reads it
# back from the installed distribution metadata and everything that reports a
# version (the OpenAPI document, /healthz, the dashboard badge) goes through
# there. Bumping it here and tagging v<version> is the whole release.
version = "0.2.0"
description = "Central case broker for the v2 real-city CFD campaign: one database of cases, many workers leasing the next one to simulate."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    # Only imported inside db.py's Postgres branch (connect() with a postgres://
    # DSN); SQLite-only local dev never touches it. Kept as a base dependency
    # rather than an extra so `uv run` needs no special install step either way.
    "psycopg[binary]>=3.2",
    # Only used by casebroker/footprints.py, to answer
    # GET /v1/cases/{id}/footprints. The dashboard cannot query Overture itself
    # -- there is no REST API and no published tile endpoint -- so the broker
    # runs the same client, pinned to the same release, that the CFD runner uses.
    "overturemaps>=1.0.2",
    # Reads a 48x48 window of the GEDTM30 COG to say whether a site has real
    # terrain before it is simulated. Optional at runtime -- footprints.terrain()
    # degrades to "unknown" if the import fails -- but shipped so the answer is
    # actually available.
    "rasterio>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

# Removed earlier in this repo's history because it pointed at a casebroker.cli
# that had never been written, so the installed command failed on every run.
# Restored now that the module exists and answers the question that turned out to
# be genuinely confusing: what token do I need, and what can this one do?
[project.scripts]
casebroker = "casebroker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["casebroker"]
