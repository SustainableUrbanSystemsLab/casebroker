# Cloud-VM deployment. `cp .env.example .env`, set BROKER_DOMAIN, then
# `docker compose up -d`.
#
# No token is required to start: the broker is secured by an ACCOUNT, created on
# first visit to the dashboard. Set CASEBROKER_SETUP_TOKEN in .env if this host
# is reachable from the internet before you get to it -- otherwise whoever finds
# it first becomes the admin. The shared CASEBROKER_WRITE_TOKENS still works and
# is still honoured; it is simply no longer the only way in.
#
# Caddy terminates TLS and gets a certificate automatically, because the bearer
# token is sent in a header and must never cross plain HTTP.
services:
  broker:
    build: .
    restart: unless-stopped
    environment:
      # Unlike the Render deployment, ./data is a real bind mount, so SQLite here
      # genuinely persists -- this is the self-hosted-VM path. For a managed
      # database instead, replace this with the Supabase DSN and drop the volume.
      CASEBROKER_DB: ${CASEBROKER_DB:-/data/campaign.sqlite}
      # Every one of these is optional, and none may be `:?` -- requiring a
      # variable here meant `cp .env.example .env && docker compose up -d`, the
      # documented sequence, died before starting: compose demanded the
      # DEPRECATED name while .env.example defines the current one.
      CASEBROKER_WRITE_TOKENS: ${CASEBROKER_WRITE_TOKENS:-}
      CASEBROKER_READ_TOKENS: ${CASEBROKER_READ_TOKENS:-}
      CASEBROKER_SETUP_TOKEN: ${CASEBROKER_SETUP_TOKEN:-}
    volumes:
      - ./data:/data
    expose: ["8000"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      BROKER_DOMAIN: ${BROKER_DOMAIN:?set BROKER_DOMAIN in .env}
    command: caddy reverse-proxy --from ${BROKER_DOMAIN} --to broker:8000
    volumes:
      - ./caddy_data:/data
    depends_on: [broker]
