name: test

# Three tiers, matching the two-engine design in casebroker/db.py:
#
#   sqlite              no secret, every push and PR (including forks, where
#                       secrets are never exposed regardless).
#   postgres (throwaway) a disposable service container, every push and PR. This
#                       is where the Postgres-specific code is actually
#                       exercised on a PR -- the suite below runs only on main,
#                       so before this job existed a change to the Postgres
#                       branch of db.py reached main having never run against
#                       any Postgres at all. It is also the only place the
#                       SCHEMA RECONCILER may run: those tests CREATE, ALTER and
#                       DROP tables, which is a different contract from the
#                       row-level cleanup the shared database below relies on.
#   real postgres       the ACTUAL production database via the DBSTRING secret,
#                       pushes to main only -- where "this touched the real
#                       database and cleaned up after itself" is worth
#                       re-confirming on every change to db.py. A credential
#                       that cannot connect SKIPS this job with a warning
#                       annotation rather than failing it: that database is a
#                       third party, and a stale secret says nothing about the
#                       commit under test. CASEBROKER_TEST_PG_REQUIRED=1 makes
#                       it a hard failure again.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The version stalled twice: four merges after v0.2.0, then thirty-seven after
  # v0.3.0 including seven features, both times with every test green. Tagging
  # was automated after the first stall and the BUMP was left as a step someone
  # had to remember -- which is why it stalled again immediately. A step nobody
  # is forced to take is not a process. This is the forcing function.
  version:
    name: the version moves with the change
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base branch is read, so shallow will not do
      - name: The version has to rise
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE"
          python3 scripts/bump_version.py --check --base "origin/$BASE"

  sqlite:
    name: sqlite (no external dependency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run --with pytest --with httpx python -m pytest tests/ --ignore=tests/test_db_postgres.py -v

  postgres-throwaway:
    name: postgres (throwaway container)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campaign
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run --with pytest python -m pytest tests/test_db_postgres.py -v
        env:
          # Disposable, so the DDL the reconciler tests need is free of
          # consequence here. sslmode=disable because this is a loopback
          # container, not a network hop -- db.py defaults to require.
          CASEBROKER_TEST_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/campaign?sslmode=disable
          CASEBROKER_TEST_PG_SCRATCH: "1"

  postgres:
    name: real postgres (main only)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run --with pytest python -m pytest tests/test_db_postgres.py -v -rs
        env:
          # test_db_postgres.py prefixes every row it creates with a per-run UUID
          # and deletes them all in a module-scoped teardown -- see that file's
          # docstring. It is safe to point this at the same database the
          # deployed service uses. The tests that CREATE and DROP tables (the
          # schema reconciler) skip themselves unless
          # CASEBROKER_TEST_PG_SCRATCH is set, which only the throwaway job
          # above sets: a stray table left behind by an interrupted run would
          # be a worse outcome here than the coverage is worth.
          CASEBROKER_TEST_PG_DSN: ${{ secrets.DBSTRING }}

  docker:
    name: the image Render actually builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nothing validated the Dockerfile. Render builds from it, so the first
      # thing that ever ran it was a deploy -- which means a dependency change
      # that broke the image was discovered with the break already merged to
      # main and production still serving the previous version. This job runs on
      # pull requests too, so it fails before the merge rather than after.
      - name: Build
        run: docker build -t casebroker:ci .
      - name: Boot it and confirm it answers
        run: |
          docker run -d --name cb -p 8000:8000 \
            -e CASEBROKER_DB=/tmp/ci.sqlite casebroker:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /tmp/h.json 2>/dev/null; then
              echo "healthy after ${i}s"; cat /tmp/h.json; exit 0
            fi
            sleep 1
          done
          echo "never became healthy; container logs:" >&2
          docker logs cb >&2
          exit 1
      - name: The geo path must work on the BASE install
        # Overture is an optional extra now. GBA, GEDTM30, the canopy model and
        # the land mask must all still work without it, since they are what
        # actually gets meshed -- and an import error here is exactly what
        # dropping a dependency risks.
        run: |
          docker exec cb python -c "
          from casebroker import footprints as F
          assert F.on_land(33.749, -84.388) is True
          assert F.on_land(7.5, -37.5) is False
          assert F.gba_tile_for(33.749, -84.388) == 'w085_n35_w080_n30'
          assert F.chm_tile_for(33.749, -84.388) == '032002311'
          import casebroker.app, casebroker.worker, casebroker.cli
          print('base install is complete')
          "
      - name: Can rasterio even be imported in this image?
        # Run BEFORE the read below, so a failure names the actual cause -- a
        # missing shared library shows up here as the loader's own message,
        # which is a very different fix from "the package is not installed".
        run: |
          docker exec cb python -c "
          import importlib.util as u
          print('rasterio spec :', u.find_spec('rasterio'))
          print('numpy spec    :', u.find_spec('numpy'))
          import rasterio, numpy
          print('rasterio', rasterio.__version__, '| GDAL', rasterio.__gdal_version__, '| numpy', numpy.__version__)
          " || { echo '::error::rasterio cannot be imported inside the image'; docker exec cb pip list 2>/dev/null | grep -iE 'rasterio|numpy|affine' || true; docker exec cb ldd "$(docker exec cb python -c 'import rasterio,os;print(os.path.dirname(rasterio.__file__))' 2>/dev/null)/_base*.so" 2>/dev/null | grep 'not found' || true; exit 1; }
      - name: rasterio must actually read a remote COG from inside the image
        # The step above only proves the modules import. Terrain and canopy are
        # /vsicurl reads over HTTPS through GDAL's bundled curl, and whether
        # THAT works in a python:3.12-slim container is not something a macOS
        # dev machine can tell you. If it fails here, every case in production
        # reports terrain and trees as unavailable while the unit suite stays
        # green -- which is exactly what nobody would notice.
        run: |
          docker exec cb python -c "
          from casebroker import footprints as F
          t = F.terrain(33.749, -84.388)
          c = F.canopy(33.749, -84.388)
          print('terrain:', t.get('source'), t.get('relief_m'), t.get('detail', ''))
          print('canopy :', c.get('source'), c.get('frac_canopy'), c.get('detail', ''))
          assert t['source'] == 'gedtm30', t
          assert c['source'] == 'meta-wri-chm-v1', c
          assert c['frac_canopy'] > 0.05, c
          print('rasterio reads remote COGs from inside the image')
          "
      - name: Container logs (always)
        if: always()
        run: docker logs cb || true

  deploy-smoke-test:
    name: deploy this commit to Render and confirm it came up healthy
    # Render's GitHub App integration turned out NOT to include this repo in its
    # "selected repositories" list (this repo was born from a git subtree split
    # into a brand-new repo, never connected through Render's own "Connect a
    # repo" UI flow) -- autoDeploy showed "yes" in the service config, but no
    # webhook delivery ever reached GitHub for it (confirmed empty via
    # `gh api repos/.../hooks`), so pushes silently did not deploy anything
    # while this job kept reporting green. It was checking `deploys?limit=1`
    # and accepting whatever status that returned -- true even when the "latest"
    # deploy was a STALE one from a previous commit, which is exactly what
    # happened: three real pushes in a row went undetected as un-deployed.
    # So this job now TRIGGERS its own deploy of the commit that triggered this
    # workflow run, and polls that specific deploy id -- never trusting "the
    # latest deploy is live" as a proxy for "MY commit is live".
    # sqlite only. The postgres job hits a SHARED, third-party database, so its
    # failures are not all statements about this commit: Supabase answering a
    # burst of connections with ECIRCUITBREAKER blocked a deploy of code that was
    # entirely fine. The sqlite suite covers the same logic with no external
    # dependency, and the step below verifies the deployed service's health
    # against the real database anyway -- so a genuinely broken database still
    # fails this job, just at the point where it is actually evidence.
    needs: [sqlite, docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      # From https://dashboard.render.com/web/srv-dafe8kdg1s2s73e703tg -- if the
      # service is ever recreated, update this to the new srv-... id from the
      # dashboard URL.
      RENDER_SERVICE_ID: srv-dafe8kdg1s2s73e703tg
      RENDER_URL: https://casebroker.onrender.com
    steps:
      - name: Trigger a deploy and capture its commit + id
        id: deploy
        run: |
          resp=$(curl -s -X POST -H "Authorization: Bearer ${{ secrets.RENDERAPIKEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" -d '{}')
          deploy_id=$(echo "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          deployed_sha=$(echo "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin)['commit']['id'])")
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "triggered deploy $deploy_id for commit $deployed_sha"
          # Render deploys the branch HEAD, which -- for a push-triggered run on
          # main -- IS github.sha; if it ever disagrees, something is racing
          # (another push landed between this one and the trigger call above)
          # and that is worth knowing rather than silently checking the wrong
          # commit's health.
          if [ "$deployed_sha" != "${{ github.sha }}" ]; then
            echo "::warning::Render deployed $deployed_sha, but this workflow run is for ${{ github.sha }} -- another push likely landed first"
          fi

      - name: Wait for that specific deploy to reach a terminal state
        run: |
          deploy_id="${{ steps.deploy.outputs.deploy_id }}"
          for i in $(seq 1 40); do
            status=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDERAPIKEY }}" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))")
            echo "[$i] deploy $deploy_id status: $status"
            case "$status" in
              live) exit 0 ;;
              canceled)
                # Render cancels a deploy when a NEWER one supersedes it, which
                # is what two pushes a few minutes apart look like. That says
                # nothing about THIS commit, and failing on it puts a red X on a
                # commit that is fine -- exactly the "trains people to ignore a
                # red X" failure this job was rewritten to avoid.
                #
                # Superseded is not unverified: the push that superseded it has
                # its own run of this workflow, against a commit that contains
                # this one, and that run is what gates. So this reports and
                # passes rather than crying wolf.
                echo "::notice::deploy $deploy_id was superseded by a newer"\
                     "deploy; the run for that newer commit is what verifies it"
                exit 0 ;;
              build_failed|update_failed|deactivated)
                echo "::error::Render deploy $deploy_id ended in status '$status'"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for deploy $deploy_id to go live"; exit 1

      - name: Hit the live /healthz and check it, without ever printing the response
        run: |
          # Never echo this response: for a Postgres CASEBROKER_DB it is the
          # connection string with only the password masked, so host/user/db
          # name are still real infrastructure details worth keeping out of a
          # public repo's public Action logs even though they are not secrets.
          code=$(curl -s -o /tmp/healthz.json -w "%{http_code}" "$RENDER_URL/healthz")
          ok=$(python3 -c "import json; print(json.load(open('/tmp/healthz.json')).get('ok'))")
          # `version` is public (it is in the repo and in the OpenAPI document),
          # so unlike `db` it is safe to echo -- and it is the only field that
          # says WHAT is serving traffic rather than merely that something is.
          ver=$(python3 -c "import json; print(json.load(open('/tmp/healthz.json')).get('version','MISSING'))")
          echo "http_status=$code ok=$ok version=$ver"
          test "$code" = "200" -a "$ok" = "True"
          # A broker that cannot say its own version is one built before the
          # single-source-of-truth wiring existed, which means this deploy did
          # not ship the code this workflow just tested.
          test "$ver" != "MISSING" -a "$ver" != "None"

