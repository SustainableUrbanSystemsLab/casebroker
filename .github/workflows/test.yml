name: test

# Three tiers, matching the two-engine design in casebroker/db.py:
#
#   sqlite              no secret, every push and PR (including forks, where
#                       secrets are never exposed regardless).
#   postgres (throwaway) a disposable service container, every push and PR. This
#                       is where the Postgres-specific code is actually
#                       exercised on a PR -- the suite below runs only on main,
#                       so before this job existed a change to the Postgres
#                       branch of db.py reached main having never run against
#                       any Postgres at all. It is also the only place the
#                       SCHEMA RECONCILER may run: those tests CREATE, ALTER and
#                       DROP tables, which is a different contract from the
#                       row-level cleanup the shared database below relies on.
#   real postgres       the ACTUAL production database via the DBSTRING secret,
#                       pushes to main only -- where "this touched the real
#                       database and cleaned up after itself" is worth
#                       re-confirming on every change to db.py. A credential
#                       that cannot connect SKIPS this job with a warning
#                       annotation rather than failing it: that database is a
#                       third party, and a stale secret says nothing about the
#                       commit under test. CASEBROKER_TEST_PG_REQUIRED=1 makes
#                       it a hard failure again.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The version stalled twice: four merges after v0.2.0, then thirty-seven after
  # v0.3.0 including seven features, both times with every test green. Tagging
  # was automated after the first stall and the BUMP was left as a step someone
  # had to remember -- which is why it stalled again immediately. A step nobody
  # is forced to take is not a process. This is the forcing function.
  # ...and it stalled a THIRD time, at 0.5.0, because this ran on pull requests
  # only and the repo pushes straight to main. Now: a pull request is checked
  # against its base, a push commit by commit, and the deploy waits for it.
  version:
    name: the version moves with the change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base branch and the parents are read, so shallow will not do
      - name: The version has to rise
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE"
            python3 scripts/bump_version.py --check --base "origin/$BASE"
          else
            python3 scripts/bump_version.py --check --range "${BEFORE}..HEAD"
          fi

  sqlite:
    name: sqlite (no external dependency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # --extra export: tests/test_export.py writes Parquet and Zarr, which the
      # server does not depend on; without the extra those tests skip, silently.
      - run: uv run --extra export --with pytest --with httpx python -m pytest tests/ --ignore=tests/test_db_postgres.py -v

  postgres-throwaway:
    name: postgres (throwaway container)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campaign
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run --with pytest python -m pytest tests/test_db_postgres.py -v
        env:
          # Disposable, so the DDL the reconciler tests need is free of
          # consequence here. sslmode=disable because this is a loopback
          # container, not a network hop -- db.py defaults to require.
          CASEBROKER_TEST_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/campaign?sslmode=disable
          CASEBROKER_TEST_PG_SCRATCH: "1"

  postgres:
    name: real postgres (main only)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run --with pytest python -m pytest tests/test_db_postgres.py -v -rs
        env:
          # test_db_postgres.py prefixes every row it creates with a per-run UUID
          # and deletes them all in a module-scoped teardown -- see that file's
          # docstring. It is safe to point this at the same database the
          # deployed service uses. The tests that CREATE and DROP tables (the
          # schema reconciler) skip themselves unless
          # CASEBROKER_TEST_PG_SCRATCH is set, which only the throwaway job
          # above sets: a stray table left behind by an interrupted run would
          # be a worse outcome here than the coverage is worth.
          CASEBROKER_TEST_PG_DSN: ${{ secrets.DBSTRING }}

  docker:
    name: the image the server runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nothing validated the Dockerfile. Production runs the image built from
      # it (Render built it until 2026-10-06; GHCR + the server since), so the first
      # thing that ever ran it was a deploy -- which means a dependency change
      # that broke the image was discovered with the break already merged to
      # main and production still serving the previous version. This job runs on
      # pull requests too, so it fails before the merge rather than after.
      - name: Build
        run: docker build -t casebroker:ci .
      - name: Boot it and confirm it answers
        run: |
          docker run -d --name cb -p 8000:8000 \
            -e CASEBROKER_DB=/tmp/ci.sqlite casebroker:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /tmp/h.json 2>/dev/null; then
              echo "healthy after ${i}s"; cat /tmp/h.json; exit 0
            fi
            sleep 1
          done
          echo "never became healthy; container logs:" >&2
          docker logs cb >&2
          exit 1
      - name: The geo path must work on the BASE install
        # Overture is an optional extra now. GBA, GEDTM30, the canopy model and
        # the land mask must all still work without it, since they are what
        # actually gets meshed -- and an import error here is exactly what
        # dropping a dependency risks.
        run: |
          docker exec cb python -c "
          from casebroker import footprints as F
          assert F.on_land(33.749, -84.388) is True
          assert F.on_land(7.5, -37.5) is False
          assert F.gba_tile_for(33.749, -84.388) == 'w085_n35_w080_n30'
          assert F.chm_tile_for(33.749, -84.388) == '032002311'
          import casebroker.app, casebroker.worker, casebroker.cli
          print('base install is complete')
          "
      - name: Can rasterio even be imported in this image?
        # Run BEFORE the read below, so a failure names the actual cause -- a
        # missing shared library shows up here as the loader's own message,
        # which is a very different fix from "the package is not installed".
        run: |
          docker exec cb python -c "
          import importlib.util as u
          print('rasterio spec :', u.find_spec('rasterio'))
          print('numpy spec    :', u.find_spec('numpy'))
          import rasterio, numpy
          print('rasterio', rasterio.__version__, '| GDAL', rasterio.__gdal_version__, '| numpy', numpy.__version__)
          " || { echo '::error::rasterio cannot be imported inside the image'; docker exec cb pip list 2>/dev/null | grep -iE 'rasterio|numpy|affine' || true; docker exec cb ldd "$(docker exec cb python -c 'import rasterio,os;print(os.path.dirname(rasterio.__file__))' 2>/dev/null)/_base*.so" 2>/dev/null | grep 'not found' || true; exit 1; }
      - name: rasterio must actually read a remote COG from inside the image
        # The step above only proves the modules import. Terrain and canopy are
        # /vsicurl reads over HTTPS through GDAL's bundled curl, and whether
        # THAT works in a python:3.12-slim container is not something a macOS
        # dev machine can tell you. If it fails here, every case in production
        # reports terrain and trees as unavailable while the unit suite stays
        # green -- which is exactly what nobody would notice.
        run: |
          docker exec cb python -c "
          from casebroker import footprints as F
          t = F.terrain(33.749, -84.388)
          c = F.canopy(33.749, -84.388)
          print('terrain:', t.get('source'), t.get('relief_m'), t.get('detail', ''))
          print('canopy :', c.get('source'), c.get('frac_canopy'), c.get('detail', ''))
          assert t['source'] == 'gedtm30', t
          assert c['source'] == 'meta-wri-chm-v1', c
          assert c['frac_canopy'] > 0.05, c
          print('rasterio reads remote COGs from inside the image')
          "
      - name: Container logs (always)
        if: always()
        run: docker logs cb || true

  publish-image:
    name: push this commit's image to GHCR for the server
    # The self-hosted does not build anything: it pulls. Watchtower on the server
    # polls ghcr.io/...:latest and recreates the broker container when the
    # digest moves. Gated on the suites and the image
    # smoke test above must pass first -- so the server never pulls a commit that
    # failed CI. :sha-<full sha> is pushed alongside :latest so a roll back is
    # just pinning the compose file to an older tag.
    needs: [sqlite, docker, version]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          # GHCR requires a lowercase repository path; the org name is not.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --build-arg CASEBROKER_COMMIT="${{ github.sha }}" \
            -t "$image:latest" -t "$image:sha-${{ github.sha }}" .
          docker push "$image:sha-${{ github.sha }}"
          docker push "$image:latest"
